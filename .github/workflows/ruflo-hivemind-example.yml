# Example caller for ruflo-hivemind.yml (same repository).
#
# Prerequisites:
#   - Repository secret ANTHROPIC_API_KEY
#   - Optional repository secret MAESTRO_GH_TOKEN: a PAT (repo + workflow scopes) or GitHub
#     App installation token (Contents: write + Workflows: write). Needed to push changes to
#     .github/workflows/ files; without it the workflow falls back to GITHUB_TOKEN, which
#     cannot push workflow files.
#   - Branch is pushable by the token (not blocked by protection without bypass)
#
# Other repos can call:
#   uses: <owner>/github-workflow-examples/.github/workflows/ruflo-hivemind.yml@<ref>
#   secrets:
#     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#     MAESTRO_GH_TOKEN: ${{ secrets.MAESTRO_GH_TOKEN }}  # optional
#   with:
#     instruction: "..."
#     model: "claude-sonnet-4-20250514"

name: RuFlo Hive Mind (example caller)

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: Task for the RuFlo agent team
        required: true
        type: string
        default: "Review this repository and suggest one small documentation improvement."
      model:
        description: Anthropic model slug for primary (Opus/Sonnet) tiers
        required: false
        type: string
        default: "claude-sonnet-4-6"
      fast_model:
        description: Anthropic model slug for secondary (Haiku/subagent) tiers
        required: false
        type: string
        default: "claude-haiku-4-5"
      ruflo_version:
        description: Version of RuFlo to use
        required: false
        type: string
        default: "3.12.4"

jobs:
  ruflo:
    permissions:
      contents: write
    uses: AsperitasConsulting/maestro-ai-github-workflows/.github/workflows/ruflo-hivemind.yml@v1.0.0
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MAESTRO_GH_TOKEN: ${{ secrets.MAESTRO_GH_TOKEN }}
    with:
      instruction: ${{ inputs.instruction }}
      model: ${{ inputs.model }}
      fast_model: ${{ inputs.fast_model }}
      ruflo_version: ${{ inputs.ruflo_version }}
